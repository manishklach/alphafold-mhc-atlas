<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MHC Atlas UI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ url_for('index') }}">Peptide-MHC Atlas UI</a>
        <nav class="nav">
          <a href="{{ url_for('index') }}">Projects</a>
        </nav>
      </div>
    </header>
    <main class="wrap page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
