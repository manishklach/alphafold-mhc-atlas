project_name: "mhc_phase6_demo"
output_dir: "../outputs/mhc_phase6_demo"

alleles:
  - allele_name: "HLA-A*02:01"
    class_type: "I"
    heavy_chain_sequence: "ACDEFGHIKLMNPQRSTVWYACDEFGHIKLMNPQRSTVWY"
    beta2m_sequence: "MNPQRSTVWYACDEFGHIKL"
    reference_file: null
    allow_metadata_only_fallback: false
  - allele_name: "HLA-B*07:02"
    class_type: "I"
    heavy_chain_sequence: "TVWYACDEFGHIKLMNPQRSTVWYACDEFGHIKLMNPQRS"
    beta2m_sequence: "QRSTVWYACDEFGHIKLMNP"
    reference_file: null
    allow_metadata_only_fallback: false

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "GILGFVFTL"
  mutation_positions: [2, 9]
  allowed_substitutions: ["A", "V", "L", "I", "F", "Y"]

prediction_inputs:
  write_multimer_fasta: true
  write_chain_manifest: true
  write_colabfold_csv: true

parsing:
  prediction_root: "../outputs/mhc_phase6_demo/predictions"

analysis:
  baseline_variant_id: "WT"

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.5
  use_all_atom_contacts: true
  fallback_to_ca_distance: true
  compute_wt_deltas: true
  compute_optional_geometry_metrics: true
  mutated_positions_of_interest: []
  anchor_positions: [2, 9]
  require_confident_chain_mapping: true

clustering:
  enabled: true
  min_variants_required: 5
  features:
    - delta_confidence_vs_wt
    - delta_total_contacts_vs_wt
    - delta_mean_min_distance_vs_wt
    - delta_contacts_at_mutated_position_vs_wt
  standardize: true

cross_allele_analysis:
  enabled: true
  require_min_alleles: 2
  compare_pocket_signatures: true
  compare_tolerance_fingerprints: true
  compare_anchor_patterns: true
  use_combined_similarity: true
  similarity_metrics:
    numeric: "euclidean"
    set_based: "jaccard"
  standardize_numeric_features: true

pocket_signature:
  enabled: true
  min_contact_frequency: 1
  anchor_positions: [2, 9]
  compute_anchor_specific_signatures: true
  require_confident_chain_mapping: true

pocket_regions:
  enabled: true
  mapping_file: "../data/pocket_regions.yaml"
  require_region_mapping_for_comparison: false

multi_allele:
  shared_mutation_panel: true
  allele_specific_reference_peptides: false

reporting:
  enabled: true
  generate_markdown_report: true
  generate_publication_bundle: true
  include_case_studies: true
  include_hypotheses: true
  core_figure_limit: 8
  core_table_limit: 8

hypothesis_generation:
  enabled: true
  min_supporting_variants: 3
  min_supporting_alleles: 2
  include_low_confidence_hypotheses: true
  require_structural_support: false
  categories:
    - shared_tolerance_pattern
    - anchor_disruption_pattern
    - allele_specific_contact_network
    - pocket_region_sensitivity

publication_bundle:
  enabled: true
  include_notebook_exports: true
  copy_figures: true
  copy_tables: true

prioritization:
  enabled: true
  default_top_k: 10
  ranking_modes:
    disruptive_mutations:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "delta_total_contacts_vs_wt"
          weight: -1.0
        - name: "delta_mean_min_distance_vs_wt"
          weight: 0.75
        - name: "delta_confidence_vs_wt"
          weight: -0.5
        - name: "anchor_disruption_flag"
          weight: 1.0
    tolerated_mutations:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "delta_total_contacts_vs_wt"
          weight: 1.0
        - name: "delta_mean_min_distance_vs_wt"
          weight: -0.75
        - name: "delta_confidence_vs_wt"
          weight: 0.5
    allele_discriminating_mutations:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "cross_allele_contact_divergence"
          weight: 1.0
        - name: "cross_allele_rank_divergence"
          weight: 0.75
    anchor_sensitive_mutations:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "delta_contacts_at_anchor_positions_vs_wt"
          weight: -1.0
        - name: "anchor_disruption_flag"
          weight: 1.0
    exploratory_followup_candidates:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "absolute_contact_change"
          weight: 0.7
        - name: "cross_allele_contact_divergence"
          weight: 0.5
        - name: "case_study_relevance_flag"
          weight: 0.5

uncertainty:
  enabled: true
  penalize_missing_features: true
  penalize_unconfident_chain_mapping: true

robustness:
  enabled: true
  contact_distance_thresholds: [4.0, 4.5, 5.0]
  weight_perturbation_fraction: 0.2
  missing_feature_drop_tests: true
  replicate_consistency: true
  compare_top_k: [5, 10]

benchmarking:
  enabled: true
  reference_structure_map: null
  known_disruptive_variants_file: null
  expected_anchor_positions: [2, 9]

panel_design:
  enabled: true
  max_panel_size: 12
  ranking_goal: "balanced_exploration_panel"
  require_min_evidence_coverage: 0.5
  penalize_high_uncertainty: true
  diversity_constraints:
    max_variants_per_position: 3
    max_variants_per_allele: 4
    max_variants_per_substitution: 3
  redundancy_features:
    - "allele_name"
    - "mutated_position"
    - "mut_residue"

interactive_app:
  enabled: true
  framework: "streamlit"
  default_project: null
  enable_demo_mode: true
  enable_scenario_saving: true
  max_rows_preview: 200

scenario_analysis:
  enabled: true
  default_evidence_coverage_threshold: 0.5
  default_uncertainty_levels_allowed: ["low", "moderate"]
  allow_custom_filters: true
  allow_side_by_side_comparison: true

demo_mode:
  enabled: true
  default_demo_project: "small_project"

scenario_templates:
  enabled: true
  template_file: "../data/scenario_templates.yaml"

case_studies:
  enabled: true
  definitions:
    - case_id: "anchor_position_comparison"
      description: "Compare anchor-disruption patterns at positions 2 and 9 across selected alleles."
      alleles: ["HLA-A*02:01", "HLA-B*07:02"]
      peptides: ["GILGFVFTL"]
      mutation_positions: [2, 9]
      substitutions: ["A", "F", "Y"]
