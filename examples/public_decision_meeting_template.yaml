# Workflow-oriented decision meeting template.
# Intended for a narrow project that will be discussed directly in a weekly review packet and manager export.

project_name: "example_public_decision_meeting_template"
output_dir: "../outputs/example_public_decision_meeting_template"

alleles:
  - allele_name: "HLA-A*02:01"
    class_type: "I"
    heavy_chain_sequence: null
    beta2m_sequence: null
    reference_file: "../data/allele_reference.yaml"
    allow_metadata_only_fallback: true

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "NLVPMVATV"
  mutation_positions: [2, 9]
  allowed_substitutions: ["A", "F", "I", "L", "V", "Y"]

prediction_inputs:
  write_multimer_fasta: true
  write_chain_manifest: true
  write_colabfold_csv: true

parsing:
  prediction_root: "../outputs/example_public_decision_meeting_template/predictions"

analysis:
  baseline_variant_id: "WT"

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.5
  use_all_atom_contacts: true
  fallback_to_ca_distance: true
  compute_wt_deltas: true
  compute_optional_geometry_metrics: false
  mutated_positions_of_interest: [2, 9]
  anchor_positions: [2, 9]
  require_confident_chain_mapping: true

pilot_workflow:
  enabled: true
  save_sessions: true
  enable_review_queue: true
  enable_annotations: true
  enable_feedback: true
  enable_handoff_bundles: true

reporting:
  enabled: true
  generate_markdown_report: true
  generate_publication_bundle: true
  include_case_studies: false
  include_hypotheses: true
  core_figure_limit: 6
  core_table_limit: 6
