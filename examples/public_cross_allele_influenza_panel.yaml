# Public-data-style multi-allele example using the influenza M1 peptide GILGFVFTL.
# Allele names are public and common; populate local sequence references from IPD-IMGT/HLA.

project_name: "example_public_cross_allele_influenza_panel"
output_dir: "../outputs/example_public_cross_allele_influenza_panel"

alleles:
  - allele_name: "HLA-A*02:01"
    class_type: "I"
    heavy_chain_sequence: null
    beta2m_sequence: null
    reference_file: "../data/allele_reference.yaml"
    allow_metadata_only_fallback: true
  - allele_name: "HLA-B*07:02"
    class_type: "I"
    heavy_chain_sequence: null
    beta2m_sequence: null
    reference_file: "../data/allele_reference.yaml"
    allow_metadata_only_fallback: true

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "GILGFVFTL"
  mutation_positions: [2, 9]
  allowed_substitutions: ["A", "F", "I", "L", "V", "Y"]

prediction_inputs:
  write_multimer_fasta: true
  write_chain_manifest: true
  write_colabfold_csv: true

parsing:
  prediction_root: "../outputs/example_public_cross_allele_influenza_panel/predictions"

analysis:
  baseline_variant_id: "WT"

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.5
  use_all_atom_contacts: true
  fallback_to_ca_distance: true
  compute_wt_deltas: true
  compute_optional_geometry_metrics: true
  mutated_positions_of_interest: [2, 9]
  anchor_positions: [2, 9]
  require_confident_chain_mapping: true

cross_allele_analysis:
  enabled: true
  require_min_alleles: 2
  compare_pocket_signatures: true
  compare_tolerance_fingerprints: true
  compare_anchor_patterns: true
  use_combined_similarity: true
  similarity_metrics:
    numeric: "euclidean"
    set_based: "jaccard"
  standardize_numeric_features: true

reporting:
  enabled: true
  generate_markdown_report: true
  generate_publication_bundle: true
  include_case_studies: true
  include_hypotheses: true
  core_figure_limit: 8
  core_table_limit: 8
