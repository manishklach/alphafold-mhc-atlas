project_name: "viral_escape_sars_cov2"
description: "Analysis of SARS-CoV-2 Spike peptide mutations and their potential for HLA escape."
output_dir: "outputs/viral_escape_sars_cov2"

alleles:
  - allele_name: "HLA-A*02:01"
  - allele_name: "HLA-B*07:02"
  - allele_name: "HLA-A*24:02"

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "YLQPRTFLL"  # Spike 269-277
    - "NYNYLYRLF"  # Spike 448-456
    - "KVGGNYNYL"  # Spike 444-452
  mutation_positions: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  allowed_substitutions: ["A", "D", "E", "G", "S", "T"]

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.0

prioritization:
  enabled: true
  ranking_modes:
    - "disruptive_mutations" # High disruption = potential escape

panel_design:
  enabled: true
  max_panel_size: 15
  ranking_goal: "disruptive_diversity_panel"

reporting:
  enabled: true
