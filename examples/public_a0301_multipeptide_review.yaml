# Public-data-style multi-peptide review example for HLA-A*03:01.
# Useful for showing how one allele can be reviewed across several peptides.

project_name: "example_public_a0301_multipeptide_review"
output_dir: "../outputs/example_public_a0301_multipeptide_review"

alleles:
  - allele_name: "HLA-A*03:01"
    class_type: "I"
    heavy_chain_sequence: null
    beta2m_sequence: null
    reference_file: "../data/allele_reference.yaml"
    allow_metadata_only_fallback: true

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "KLGGALQAK"
    - "RLRPGGKKK"
  mutation_positions: [2, 9]
  allowed_substitutions: ["A", "F", "I", "K", "L", "V", "Y"]

prediction_inputs:
  write_multimer_fasta: true
  write_chain_manifest: true
  write_colabfold_csv: true

parsing:
  prediction_root: "../outputs/example_public_a0301_multipeptide_review/predictions"

analysis:
  baseline_variant_id: "WT"

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.5
  use_all_atom_contacts: true
  fallback_to_ca_distance: true
  compute_wt_deltas: true
  compute_optional_geometry_metrics: true
  mutated_positions_of_interest: [2, 9]
  anchor_positions: [2, 9]
  require_confident_chain_mapping: true

pilot_workflow:
  enabled: true
  save_sessions: true
  enable_review_queue: true
  enable_annotations: true
  enable_feedback: true
  enable_handoff_bundles: true
