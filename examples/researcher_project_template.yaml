# Researcher project template.
# Copy this file and replace the allele names, sequences, peptides, and mutation settings
# for your own project.
#
# For real FASTA generation:
# - populate heavy_chain_sequence and beta2m_sequence directly, or
# - populate ../data/allele_reference.yaml from trusted public sources such as IPD-IMGT/HLA.

project_name: "my_peptide_mhc_project"
output_dir: "../outputs/my_peptide_mhc_project"

alleles:
  - allele_name: "HLA-A*02:01"
    class_type: "I"
    heavy_chain_sequence: null
    beta2m_sequence: null
    reference_file: "../data/allele_reference.yaml"
    allow_metadata_only_fallback: true

peptides:
  mode: "shared_panel"
  wildtype_sequences:
    - "NLVPMVATV"
  mutation_positions: [2, 9]
  allowed_substitutions: ["A", "F", "I", "L", "V", "Y"]

prediction_inputs:
  write_multimer_fasta: true
  write_chain_manifest: true
  write_colabfold_csv: true

parsing:
  prediction_root: "../outputs/my_peptide_mhc_project/predictions"

analysis:
  baseline_variant_id: "WT"

structure_analysis:
  enabled: true
  contact_distance_angstrom: 4.5
  use_all_atom_contacts: true
  fallback_to_ca_distance: true
  compute_wt_deltas: true
  compute_optional_geometry_metrics: true
  mutated_positions_of_interest: []
  anchor_positions: [2, 9]
  require_confident_chain_mapping: true

reporting:
  enabled: true
  generate_markdown_report: true
  generate_publication_bundle: true
  include_case_studies: false
  include_hypotheses: true
  core_figure_limit: 6
  core_table_limit: 6

prioritization:
  enabled: true
  default_top_k: 10
  ranking_modes:
    disruptive_mutations:
      enabled: true
      normalize_features: true
      require_structural_support: false
      features:
        - name: "delta_total_contacts_vs_wt"
          weight: -1.0
        - name: "delta_mean_min_distance_vs_wt"
          weight: 0.75
        - name: "delta_confidence_vs_wt"
          weight: -0.5
        - name: "anchor_disruption_flag"
          weight: 1.0

interactive_app:
  enabled: true
  framework: "streamlit"
  default_project: null
  enable_demo_mode: true
  enable_scenario_saving: true
  max_rows_preview: 200
