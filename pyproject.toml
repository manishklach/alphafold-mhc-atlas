[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhc-atlas-os"
version = "0.12.0"
description = "MHC Atlas OS monorepo scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manish Klach" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "biopython>=1.84",
  "pandas>=2.2",
  "streamlit>=1.44",
  "pyautogen",
]

[project.scripts]
mhc-atlas-os-api = "apps.api.main:run"

[tool.setuptools.packages.find]
include = ["apps*", "agents*", "core*", "biology*", "storage*"]
