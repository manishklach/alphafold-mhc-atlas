<svg width="1200" height="1420" viewBox="0 0 1200 1420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MHC Atlas OS Architecture</title>
  <desc id="desc">Layered architecture diagram for MHC Atlas OS showing user, runtime, orchestration, agent, core decision, domain, and storage layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="runtimeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F3FF"/>
      <stop offset="100%" stop-color="#BFE8FF"/>
    </linearGradient>
    <linearGradient id="scoringGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#C4F1D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8.5 5L1 9" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .layer-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .layer-subtitle { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .box-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .box-text { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .note-text { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #14532D; }
      .flow-text { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .pill-text { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #075985; letter-spacing: 0.08em; }
      .muted-pill-text { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #166534; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1200" height="1420" fill="url(#bg)"/>

  <text x="600" y="60" text-anchor="middle" class="title">MHC Atlas OS Architecture</text>
  <text x="600" y="92" text-anchor="middle" class="subtitle">Runtime-agnostic decision system for structure-guided experimental prioritization</text>

  <g transform="translate(70, 130)">
    <rect x="0" y="0" width="1060" height="140" rx="24" fill="#FFFFFF" stroke="#D8E2EC" filter="url(#shadow)"/>
    <text x="36" y="38" class="layer-title">1. User Layer</text>
    <text x="36" y="60" class="layer-subtitle">Human-facing entry points for interactive and programmatic use</text>

    <g transform="translate(36, 82)">
      <rect x="0" y="0" width="480" height="40" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="240" y="24" text-anchor="middle" class="box-title">Streamlit UI</text>
    </g>
    <g transform="translate(544, 82)">
      <rect x="0" y="0" width="480" height="40" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="240" y="24" text-anchor="middle" class="box-title">FastAPI API</text>
    </g>
  </g>

  <line x1="600" y1="270" x2="600" y2="308" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70, 308)">
    <rect x="0" y="0" width="1060" height="190" rx="24" fill="url(#runtimeGlow)" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="24" y="22" width="124" height="24" rx="12" fill="#E0F2FE"/>
    <text x="86" y="39" text-anchor="middle" class="pill-text">HIGHLIGHTED</text>
    <text x="36" y="74" class="layer-title">2. Runtime Layer</text>
    <text x="36" y="96" class="layer-subtitle">Selectable execution modes with a shared contract</text>

    <g transform="translate(36, 118)">
      <rect x="0" y="0" width="312" height="52" rx="16" fill="#FFFFFF" stroke="#7DD3FC"/>
      <text x="156" y="21" text-anchor="middle" class="box-title">Local Runtime</text>
      <text x="156" y="39" text-anchor="middle" class="box-text">Deterministic execution</text>
    </g>
    <g transform="translate(374, 118)">
      <rect x="0" y="0" width="312" height="52" rx="16" fill="#FFFFFF" stroke="#38BDF8"/>
      <text x="156" y="21" text-anchor="middle" class="box-title">Nemo Runtime</text>
      <text x="156" y="39" text-anchor="middle" class="box-text">Governed execution with policies</text>
    </g>
    <g transform="translate(712, 118)">
      <rect x="0" y="0" width="312" height="52" rx="16" fill="#FFFFFF" stroke="#0EA5E9"/>
      <text x="156" y="21" text-anchor="middle" class="box-title">AutoGen Runtime</text>
      <text x="156" y="39" text-anchor="middle" class="box-text">Multi-agent collaboration</text>
    </g>
  </g>

  <line x1="600" y1="498" x2="600" y2="536" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70, 536)">
    <rect x="0" y="0" width="1060" height="160" rx="24" fill="#FFFFFF" stroke="#D8E2EC" filter="url(#shadow)"/>
    <text x="36" y="42" class="layer-title">3. Orchestration Layer</text>
    <text x="36" y="64" class="layer-subtitle">Runtime-independent control flow, traceability, and policy gating</text>

    <g transform="translate(36, 90)">
      <rect x="0" y="0" width="312" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="156" y="28" text-anchor="middle" class="box-title">Agent Runner</text>
    </g>
    <g transform="translate(374, 90)">
      <rect x="0" y="0" width="312" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="156" y="28" text-anchor="middle" class="box-title">Execution Context</text>
    </g>
    <g transform="translate(712, 90)">
      <rect x="0" y="0" width="312" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="156" y="28" text-anchor="middle" class="box-title">Policy Gate</text>
    </g>
  </g>

  <line x1="600" y1="696" x2="600" y2="734" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70, 734)">
    <rect x="0" y="0" width="1060" height="160" rx="24" fill="#FFFFFF" stroke="#D8E2EC" filter="url(#shadow)"/>
    <text x="36" y="42" class="layer-title">4. Agent Layer</text>
    <text x="36" y="64" class="layer-subtitle">Thin deterministic wrappers over domain and scoring functions</text>

    <g transform="translate(36, 90)">
      <rect x="0" y="0" width="228" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="114" y="28" text-anchor="middle" class="box-title">Structure Agent</text>
    </g>
    <g transform="translate(288, 90)">
      <rect x="0" y="0" width="228" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="114" y="28" text-anchor="middle" class="box-title">Comparison Agent</text>
    </g>
    <g transform="translate(540, 90)">
      <rect x="0" y="0" width="228" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="114" y="28" text-anchor="middle" class="box-title">Prioritization Agent</text>
    </g>
    <g transform="translate(792, 90)">
      <rect x="0" y="0" width="232" height="46" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="116" y="28" text-anchor="middle" class="box-title">Review Agent</text>
    </g>
  </g>

  <line x1="600" y1="894" x2="600" y2="932" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70, 932)">
    <rect x="0" y="0" width="1060" height="220" rx="24" fill="url(#scoringGlow)" stroke="#22C55E" stroke-width="2" filter="url(#shadow)"/>
    <rect x="24" y="22" width="140" height="24" rx="12" fill="#DCFCE7"/>
    <text x="94" y="39" text-anchor="middle" class="muted-pill-text">HIGHLIGHTED</text>
    <text x="36" y="74" class="layer-title">5. Core Decision Engine</text>
    <text x="36" y="96" class="layer-subtitle">Explainable multi-factor prioritization with deterministic rules</text>

    <g transform="translate(36, 118)">
      <rect x="0" y="0" width="988" height="66" rx="18" fill="#FFFFFF" stroke="#86EFAC"/>
      <text x="494" y="24" text-anchor="middle" class="box-title">Explainable Multi-Factor Scoring Engine</text>
      <text x="494" y="46" text-anchor="middle" class="box-text">Structural Impact • Mutation Severity • Confidence Adjustment • Consistency Signal</text>
    </g>

    <g transform="translate(36, 198)">
      <rect x="0" y="0" width="988" height="44" rx="14" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="494" y="28" text-anchor="middle" class="note-text">Deterministic, interpretable, no black-box ML</text>
    </g>
  </g>

  <line x1="600" y1="1152" x2="600" y2="1190" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70, 1190)">
    <rect x="0" y="0" width="1060" height="122" rx="24" fill="#FFFFFF" stroke="#D8E2EC" filter="url(#shadow)"/>
    <text x="36" y="42" class="layer-title">6. Domain Logic</text>
    <text x="36" y="64" class="layer-subtitle">Core biological parsing and comparison utilities</text>

    <g transform="translate(36, 76)">
      <rect x="0" y="0" width="480" height="30" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="240" y="20" text-anchor="middle" class="box-title">Structure Parser</text>
    </g>
    <g transform="translate(544, 76)">
      <rect x="0" y="0" width="480" height="30" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="240" y="20" text-anchor="middle" class="box-title">Comparison Engine</text>
    </g>
  </g>

  <line x1="600" y1="1312" x2="600" y2="1342" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(320, 1342)">
    <rect x="0" y="0" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="280" y="22" text-anchor="middle" class="box-title">7. Storage</text>
    <text x="280" y="40" text-anchor="middle" class="box-text">SQLite (Decision Memory / History)</text>
  </g>

  <g transform="translate(190, 1388)">
    <text x="410" y="0" text-anchor="middle" class="flow-text">User → Runtime → Orchestration → Agents → Scoring → Output</text>
  </g>
</svg>
